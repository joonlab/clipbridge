<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="shot" content="w=1536,h=1800,scale=1">
<title>장면 2 · 맥 화면 오른쪽 — 알림센터 배너</title>
<link rel="stylesheet" href="https://mockup-kit.invalid/kit.css">
<script src="https://mockup-kit.invalid/kit.js"></script>
<style>
  /* 맥 화면의 오른쪽 위 일부만 그린다 (클로즈업 배경에서 맥은 왼쪽에 잘려 보인다) */
  .desk { zoom: 2.194; width: 700px; height: 820px; position: relative; overflow: hidden;
    background: radial-gradient(120% 90% at 80% 0%, #CFE7E2 0%, #9FC7C0 45%, #6E9E97 100%); }
  .mac-menubar { height: 40px; font-size: 18px; gap: 22px; }
  .mac-menubar .extra { font-size: 21px; height: 30px; }
  .mac-menubar .clock { font-size: 18px; }
  .doc { position: absolute; left: -40px; top: 300px; width: 560px; height: 600px; font-size: 17px; line-height: 28px; }
  .doc .mac-body { padding: 26px 30px; }
  .doc h2 { margin: 0; font-size: 26px; line-height: 34px; }
  .banners { position: absolute; right: 18px; top: 54px; display: flex; flex-direction: column; gap: 14px; z-index: 5; }
  .mac-notification { width: 590px; padding: 18px 20px; grid-template-columns: 58px 1fr; gap: 16px; border-radius: 24px; font-size: 22px; line-height: 30px;
    box-shadow: 0 10px 30px rgba(15,20,30,.18); }
  .mac-notification > img { width: 58px; height: 58px; border-radius: 13px; }
  .mac-notification .n-title { font-size: 22px; }
  .mac-notification .n-time { font-size: 18px; }
  .mac-notification .n-body { font-size: 22px; line-height: 30px; }
</style></head><body>
<div class="desk">
  <div class="mac-menubar">
    <span>보기</span><span>윈도우</span><span>도움말</span>
    <div class="extras"><span class="extra"><i data-icon="wifi"></i></span><span class="extra"><i data-icon="battery"></i></span><span class="clock">9월 28일 (일) 오후 3:05</span></div>
  </div>
  <div class="banners">
    <div class="mac-notification">
      <img data-app="clipbridge" alt="">
      <div>
        <div class="n-top"><span class="n-title">메신저</span><span class="n-time">지금</span></div>
        <div class="n-body"><b>민지</b> · 내일 회의 10시 맞지?</div>
      </div>
    </div>
    <div class="mac-notification">
      <img data-app="clipbridge" alt="">
      <div>
        <div class="n-top"><span class="n-title">택배</span><span class="n-time">2분 전</span></div>
        <div class="n-body"><b>배송 출발</b> · 오늘 오후 도착 예정입니다</div>
      </div>
    </div>
  </div>
  <div class="mac-window doc">
    <div class="mac-titlebar"><span class="traffic"><i></i><i></i><i></i></span><span class="mac-title">주간 정리.txt</span></div>
    <div class="mac-body">
      <h2>이번 주 할 일</h2>
      <div>· 발표 자료 다듬기</div>
      <div>· 월요일 회의 안건 정리</div>
      <div class="dim">· 도서관 책 반납</div>
    </div>
  </div>
</div>
</body></html>
