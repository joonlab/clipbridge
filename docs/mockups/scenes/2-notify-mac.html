<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="shot" content="w=1800,h=1296,scale=1">
<title>장면 2 · 맥 화면 오른쪽 — 알림센터 배너</title>
<link rel="stylesheet" href="https://mockup-kit.invalid/kit.css">
<script src="https://mockup-kit.invalid/kit.js"></script>
<style>
  /* 클로즈업 배경에서 맥은 왼쪽이 잘려 보인다 → 맥 화면의 오른쪽 부분(1.39:1)만 그린다 */
  .desk { zoom: 2.25; width: 800px; height: 576px; position: relative; overflow: hidden;
    background: radial-gradient(120% 90% at 80% 0%, #CFE7E2 0%, #9FC7C0 45%, #6E9E97 100%); }
  .mac-menubar { height: 30px; font-size: 15px; gap: 18px; }
  .mac-menubar .extra { font-size: 17px; }
  .mac-menubar .clock { font-size: 15px; }
  .doc { position: absolute; left: 16px; top: 250px; width: 380px; height: 360px; }
  .doc .mac-body { padding: 20px 24px; font-size: 17px; line-height: 28px; }
  .doc h2 { margin: 0 0 4px; font-size: 22px; line-height: 30px; }
  .banners { position: absolute; right: 14px; top: 42px; display: flex; flex-direction: column; gap: 12px; z-index: 5; }
  .mac-notification { width: 470px; padding: 14px 16px; grid-template-columns: 48px 1fr; gap: 14px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(15,20,30,.18); }
  .mac-notification > img { width: 48px; height: 48px; border-radius: 11px; }
  .mac-notification .n-title { font-size: 19px; }
  .mac-notification .n-time { font-size: 15px; }
  .mac-notification .n-body { font-size: 19px; line-height: 27px; }
  /* 배경 G 의 맥 화면 아래 가장자리 초록 경계가 들쭉날쭉해 합성 후 검은 톱니가 보인다 → 화면 맨 아래를 베젤처럼 어둡게 */
  .desk::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #0b0b0c; z-index: 9; }
</style></head><body>
<div class="desk">
  <div class="mac-menubar">
    <span>보기</span><span>윈도우</span><span>도움말</span>
    <div class="extras"><span class="extra"><i data-icon="wifi"></i></span><span class="extra"><i data-icon="battery"></i></span><span class="clock">9월 28일 (일) 오후 3:05</span></div>
  </div>
  <div class="banners">
    <div class="mac-notification">
      <img data-app="clipbridge" alt="">
      <div>
        <div class="n-top"><span class="n-title">📱 메신저</span><span class="n-time">지금</span></div>
        <div class="n-body"><b>민지</b><br>내일 회의 10시 맞지?</div>
      </div>
    </div>
    <div class="mac-notification">
      <img data-app="clipbridge" alt="">
      <div>
        <div class="n-top"><span class="n-title">📱 택배</span><span class="n-time">2분 전</span></div>
        <div class="n-body">배송 출발</div>
      </div>
    </div>
  </div>
  <div class="mac-window doc">
    <div class="mac-titlebar"><span class="traffic"><i></i><i></i><i></i></span><span class="mac-title">주간 정리.txt</span></div>
    <div class="mac-body">
      <h2>이번 주 할 일</h2>
      <div>· 발표 자료 다듬기</div>
      <div>· 월요일 회의 안건 정리</div>
    </div>
  </div>
</div>
</body></html>
