<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="shot" content="w=1800,h=1331,scale=1">
<title>장면 1 · 폰 펼친 화면(가로) — 메시지에 붙여넣기</title>
<link rel="stylesheet" href="https://mockup-kit.invalid/kit.css">
<script src="https://mockup-kit.invalid/kit.js"></script>
<style>
  /* 폴드8 펼친 화면 가로 1.35:1 — 480 x 355dp 를 3.75배 */
  .screen { zoom: 3.75; width: 480px; height: 355px; border-radius: 0; }
  .status-bar { height: 24px; font-size: 12px; padding: 0 16px; }
  .app-bar { height: 48px; gap: 10px; }
  .app-bar .title { font-size: 20px; }
  .app-bar .avatar { width: 32px; height: 32px; font-size: 15px; }
  .screen > .content { padding: 10px 18px 6px; gap: 8px; }
  .msg { font-size: 19px; line-height: 26px; padding: 9px 14px; }
  .chipline { margin: 0 14px 6px; padding: 7px 14px; border-radius: 14px; display: flex; gap: 8px; align-items: center;
    background: #1F2523; color: #F2F5F4; font-size: 16px; line-height: 21px; }
  .chipline .i { color: #5EEAD4; font-size: 18px; display: flex; }
  .input-bar { padding: 4px 12px 6px; }
  .input { font-size: 19px; line-height: 26px; padding: 8px 14px; min-height: 0; }
  .send-btn { width: 44px; height: 44px; font-size: 20px; }
  .nav-handle { height: 12px; }
  .caret { display: inline-block; width: 2px; height: 21px; background: var(--accent); vertical-align: -4px; margin-left: 1px; }
</style></head><body>
<div class="screen app-clipbridge">
  <div class="status-bar" data-time="2:31"></div>
  <div class="app-bar"><span class="avatar accent">서</span><span class="title">서준</span></div>
  <div class="content">
    <div class="msg">오늘 장 볼 거 있어?</div>
  </div>
  <div class="chipline"><span class="i"><i data-icon="clipboard"></i></span><span>붙여넣기: 장보기 목록 — 우유 2개, 달걀…</span></div>
  <div class="input-bar">
    <div class="input">장보기 목록<br>우유 2개, 달걀 한 판, 두부, 대파<span class="caret"></span></div>
    <span class="send-btn"><i data-icon="send"></i></span>
  </div>
  <div class="nav-handle"></div>
</div>
</body></html>
