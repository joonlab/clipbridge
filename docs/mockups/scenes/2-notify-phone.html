<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="shot" content="w=1137,h=1800,scale=1">
<title>장면 2 · 폰 커버 화면 — 메신저 알림</title>
<link rel="stylesheet" href="https://mockup-kit.invalid/kit.css">
<script src="https://mockup-kit.invalid/kit.js"></script>
<style>
  /* 폴드8 커버 화면 0.632:1 영역(실기 1248x1972) — 420 x 665dp 를 2.707배 */
  .screen { zoom: 2.707; width: 420px; height: 665px; border-radius: 0;
    background: linear-gradient(180deg, #13302C 0%, #0B1B19 55%, #070D0C 100%); }
  .status-bar { height: 30px; font-size: 14px; padding: 0 18px; }
  .clockbig { text-align: center; color: #F2F5F4; margin-top: 44px; }
  .clockbig .t { font-size: 84px; line-height: 90px; font-weight: 300; letter-spacing: -1px; }
  .clockbig .d { font-size: 19px; line-height: 26px; opacity: .85; margin-top: 2px; }
  .stack { margin: 40px 18px 0; display: flex; flex-direction: column; gap: 14px; }
  .notif { border-radius: 22px; padding: 18px 20px; }
  .notif .notif-head { font-size: 16px; line-height: 21px; gap: 6px; }
  .notif .notif-head .ico { font-size: 17px; color: var(--accent); display: flex; }
  .notif .notif-title { font-size: 24px; line-height: 32px; margin-top: 6px; }
  .notif .notif-body { font-size: 22px; line-height: 31px; }
  .nav-handle { position: absolute; bottom: 6px; left: 0; right: 0; }
</style></head><body>
<div class="screen dark app-clipbridge">
  <div class="status-bar on-dark" data-time="3:05"></div>
  <div class="clockbig"><div class="t">3:05</div><div class="d">9월 28일 일요일</div></div>
  <div class="stack">
    <div class="notif heads-up">
      <div class="notif-head"><span class="ico"><i data-icon="message"></i></span><span>메신저</span><span>· 지금</span></div>
      <div class="notif-title">민지</div>
      <div class="notif-body">내일 회의 10시 맞지?</div>
    </div>
    <div class="notif">
      <div class="notif-head"><span class="ico"><i data-icon="download"></i></span><span>택배</span><span>· 2분 전</span></div>
      <div class="notif-title">배송 출발</div>
    </div>
  </div>
  <div class="nav-handle"></div>
</div>
</body></html>
