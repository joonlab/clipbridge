<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="shot" content="w=1600,h=900,scale=2">
<title>ClipBridge 썸네일</title>
<link rel="stylesheet" href="https://mockup-kit.invalid/kit.css">
<script src="https://mockup-kit.invalid/kit.js"></script>
<style>
  .layout { position: absolute; inset: 0; padding: 0 80px; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 40px; }
  .txt { display: flex; flex-direction: column; gap: 20px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 84px; height: 84px; border-radius: 20px; }
  .brand .name { font-size: 60px; font-weight: 800; letter-spacing: -1px; }
  .big { font-size: 40px; font-weight: 700; line-height: 1.3; letter-spacing: -.5px; }
  .sub { font-size: 22px; color: var(--dim); line-height: 1.5; }
  .chips .chip { font-size: 17px; padding: 8px 16px; }
  .devices { display: flex; align-items: center; justify-content: center; gap: 24px; }
</style>
</head>
<body>
<div class="canvas thumb desk-accent app-clipbridge">
  <div class="layout">
    <div class="txt">
      <div class="brand"><img data-app="clipbridge" alt=""><span class="name">ClipBridge</span></div>
      <div class="big">맥에서 복사하면<br>폴드8 클립보드에 들어갑니다</div>
      <div class="sub">아이폰에서 넘어와 맥 연동을 직접 만든 기록.<br>Tailscale 위의 폰 앱 하나와 맥 서버 하나.</div>
      <div class="chips"><span class="chip on">클립보드</span><span class="chip">파일</span><span class="chip">링크</span><span class="chip">알림</span><span class="chip">문자 읽기</span><span class="chip">화면·카메라</span></div>
    </div>
    <div class="devices">
      <div class="fold-cover" style="--zoom:.88">
        <div class="screen">
          <div class="status-bar" data-time="2:31"></div>
          <div class="app-bar"><img class="mark" data-app="clipbridge" alt=""><span class="title">ClipBridge</span></div>
          <div class="content">
            <div class="card ok">
              <div class="card-row"><span class="dot ok"></span><span class="card-title">맥과 연결돼 있어요</span></div>
              <div class="meta">응답 42ms · 방금 확인</div>
            </div>
            <div class="section-label">최근 받은 것</div>
            <div class="list">
              <div class="list-row"><i class="ico" data-icon="clipboard"></i><div class="grow"><div class="card-title ellipsis">장보기 목록</div><div class="meta">클립보드 · 방금</div></div></div>
              <div class="list-row"><i class="ico" data-icon="link"></i><div class="grow"><div class="card-title ellipsis">example.com/recipe/42</div><div class="meta">링크 · 12분 전</div></div></div>
              <div class="list-row"><i class="ico" data-icon="file"></i><div class="grow"><div class="card-title ellipsis">회의자료.pdf</div><div class="meta">파일 · 1시간 전</div></div></div>
            </div>
          </div>
          <div class="nav-handle"></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
